# Roda a cada push na main e em pull requests:
# confere o código (lint e tipos), roda os testes e gera o build
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código
        uses: actions/checkout@v5

      - name: Instala o Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instala as dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos do TypeScript
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

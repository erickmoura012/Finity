server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Qualquer caminho que não é um arquivo (/projetos, /tarefas...) devolve o
  # index.html, e aí o React Router decide qual página mostrar.
  # Sem isso, recarregar a página em /projetos dava 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
